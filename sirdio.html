<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SIRDIO RADIO LIVE</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>body{margin:0;background:#000;color:#fff;font-family:system-ui;text-align:center;padding:20px}.card{background:#151515;border-radius:20px;padding:30px;max-width:420px;margin:20px auto;border:1px solid #222}.btn{padding:18px 30px;border-radius:14px;border:0;font-weight:900;font-size:20px;width:100%}.g{background:#00ff88;color:#000}.r{background:#222;color:#fff}</style></head><body>
<h1>📻 SIRDIO RADIO LIVE</h1><div class="card">
<p id="st">TAP TO LISTEN LIVE FROM KUMASI</p>
<button id="listen" class="btn g">▶ TAP TO LISTEN LIVE</button>
<audio id="audio" controls autoplay style="width:100%;margin-top:15px"></audio>
<p style="font-size:12px;color:#888;margin-top:15px">When studio offline, plays ALHA-01 mix</p>
<audio id="fallback" src="ALHA-01.mp3" controls style="width:100%;margin-top:8px"></audio>
</div>
<script>
let peer;
document.getElementById('listen').onclick=()=>{
peer=new Peer();peer.on('open',()=>{
document.getElementById('st').textContent='Connecting to Studio B...';
let call=peer.call('sirdio-studio-b-master',null,{metadata:{type:'listener'}});
call.on('stream',stream=>{document.getElementById('audio').srcObject=stream;document.getElementById('st').textContent='✅ LIVE ON AIR FROM KUMASI!';document.getElementById('listen').textContent='LIVE - LISTENING';});
call.on('error',()=>{document.getElementById('st').textContent='Studio offline - Playing mix fallback';document.getElementById('fallback').play();});
setTimeout(()=>{if(!document.getElementById('audio').srcObject){document.getElementById('st').textContent='Studio offline now - Playing ALHA mix';document.getElementById('fallback').play();}},3000);
});
};
</script></body></html>
