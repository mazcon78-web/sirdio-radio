<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIRDIO LIVE</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>body{margin:0;background:#000;color:#fff;font-family:system-ui;display:flex;align-items:center;justify-content:center;height:100vh;text-align:center}.box{background:#111;padding:20px;border-radius:16px;width:90%;max-width:360px;border:1px solid #222}.btn{width:100%;padding:18px;border-radius:12px;border:0;font-weight:900;font-size:18px;margin-top:12px}.g{background:#00ff88;color:#000}.r{background:#222;color:#fff}</style></head><body>
<div class="box"><h2>🔊 SIRDIO RADIO</h2><p id="st">Tap to Connect</p><button id="conn" class="btn g">CONNECT TO LIVE</button><audio id="audio" autoplay controls style="width:100%;margin-top:12px"></audio><p style="font-size:11px;opacity:.5;margin-top:10px">Listener Only - No Mic</p></div>
<script>let peer;document.getElementById('conn').onclick=async()=>{document.getElementById('st').textContent='Connecting...';peer=new Peer();peer.on('open',id=>{let conn=peer.connect('sirdio-studio-b-master');conn.on('open',()=>{conn.send({type:'listener-join'});});let call=peer.call('sirdio-studio-b-master',null,{metadata:{type:'listener'}});call.on('stream',s=>{document.getElementById('audio').srcObject=s;document.getElementById('st').textContent='🟢 LIVE';});call.on('error',()=>{document.getElementById('st').textContent='Studio offline';});});};</script></body></html>
