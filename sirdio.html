<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIRDIO LIVE</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>body{margin:0;background:#000;color:#fff;font-family:system-ui;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}.card{background:#151515;padding:24px;border-radius:16px;width:100%;max-width:400px;text-align:center;border:2px solid #ff9500}.btn{padding:20px;width:100%;border-radius:12px;border:0;font-weight:900;font-size:18px;background:#00ff88;color:#000;margin-top:12px}</style></head><body>
<div class="card">
<h2>🔴 SIRDIO RADIO LIVE</h2>
<p>Sir Dio Ra - Kumasi</p>
<button id="listen" class="btn">▶ TAP TO LISTEN LIVE</button>
<p id="st">Tap to connect to Studio B</p>
<audio id="audio" controls autoplay style="width:100%;margin-top:12px"></audio>
<p style="font-size:11px">WhatsApp: 026 705 2785</p>
</div>
<script>
let peer,conn;
document.getElementById('listen').onclick=async()=>{
document.getElementById('st').textContent='Connecting...';
peer=new Peer();peer.on('open',()=>{
let call=peer.call('sirdio-studio-b-master',new MediaStream(),{metadata:{type:'listener'}});
call.on('stream',s=>{document.getElementById('audio').srcObject=s;document.getElementById('st').textContent='🔴 LIVE NOW - Abbey Road Warm';});
call.on('error',e=>{document.getElementById('st').textContent='Studio offline - tell DJ to tap GO LIVE';});
});
peer.on('error',e=>{document.getElementById('st').textContent='Error: '+e.message;});
};
</script></body></html>
