<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>SIRDIO LIVE - FIXED</title><script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script></head><body style="background:#000;color:#fff;font-family:Arial;text-align:center;padding:15px"><h2 style="color:#00FF66">📻 SIRDIO RADIO LIVE - FIXED</h2><p style="color:#ffaa00">🔴 Live from Studio B</p><div style="max-width:420px;margin:auto;background:#111;border:2px solid #00FF66;border-radius:15px;padding:15px"><div id="st" style="color:#ffaa00;margin:10px">Tap to connect...</div><button id="btn" style="width:100%;padding:20px;background:#00FF66;color:#000;font-weight:900;border-radius:12px;font-size:18px">▶️ TAP TO CONNECT & LISTEN</button><audio id="mix" controls loop src="ALHA-01.mp3" style="width:100%;margin-top:12px"></audio><p style="font-size:11px;color:#666">If studio offline, ALHA-01 plays auto</p></div><script>let peer,btn=document.getElementById('btn'),st=document.getElementById('st'),mix=document.getElementById('mix');btn.onclick=()=>{st.textContent='Connecting...';btn.textContent='CONNECTING...';peer=new Peer('listener-'+Math.random().toString(36).substr(2,5));peer.on('open',()=>{let call=peer.call('sirdio-studio-b-master',new MediaStream());call.on('stream',s=>{st.textContent='🔴 LIVE CONNECTED!';btn.textContent='LIVE!';let a=new Audio();a.srcObject=s;a.autoplay=true;mix.pause();document.body.appendChild(a)});call.on('error',()=>{st.textContent='Offline - Playing mix';mix.play()});});peer.on('error',()=>{st.textContent='Studio offline - Playing ALHA-01';mix.play();btn.textContent='PLAYING MIX'});setTimeout(()=>{if(st.textContent.includes('Connecting')){st.textContent='Studio offline - Playing mix';mix.play()}},4000)};</script></body></html>
