<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>STUDIO B CONTROLLER</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>body{margin:0;background:#0a0a0a;color:#fff;font-family:system-ui;padding:10px}.card{background:#151515;border-radius:12px;padding:12px;margin:8px 0;border:1px solid #222}.btn{padding:12px 16px;border-radius:10px;border:0;font-weight:800;margin:3px}.g{background:#00ff88;color:#000}.o{background:#ff9500;color:#000}.r{background:#222;color:#fff}.redBlink{background:#ff0000;color:#fff;animation:blink 0.8s infinite;width:100%;padding:20px;font-size:18px}.greenLive{background:#00ff88;color:#000;width:100%;padding:20px;font-size:18px}@keyframes blink{50%{opacity:0.3}}audio{width:100%}</style></head><body>
<h3>🎙️ STUDIO B - CONTROLLER</h3>
<div class="card">
<audio id="player" src="./ALHA-01.mp3" controls></audio>
<div style="display:flex;flex-wrap:wrap;margin-top:8px">
<button id="play" class="btn g">▶ PLAY</button>
<button id="abbey" class="btn o">🎛️ ABBEY ROAD: OFF</button>
<button id="mic" class="btn r">🎤 STUDIO MIC OFF</button>
<button id="echo" class="btn r">🎧 DJ ECHO OFF</button>
<button id="rec" class="btn r">⏺️ RECORD OFF</button>
</div>
<p id="st">Ready</p><p style="font-size:11px">ID: <b id="myId" style="color:#00ff88"></b> | Listeners: <span id="cnt">0</span></p>
</div>
<div class="card"><h3>🚨 GUEST REQUESTS - RED BLINK</h3><div id="guestBox">No guest request</div><audio id="guestAudio" autoplay></audio></div>
<div class="card"><h3>🔴 GO LIVE</h3><button id="live" class="btn" style="width:100%;padding:20px;background:#ff0000;color:#fff;font-size:18px">🔴 GO LIVE - BROADCAST</button></div>

<script>
const player=document.getElementById('player');
let ctx,src,gain,low,high,echoDelay,dest,micS,recorder,chunks=[],liveOn=false,abbeyOn=false,echoOn=false,micOn=false,peer,pendingGuest=null;
function init(){if(ctx)return;ctx=new(window.AudioContext||window.webkitAudioContext)();dest=ctx.createMediaStreamDestination();src=ctx.createMediaElementSource(player);low=ctx.createBiquadFilter();low.type='lowshelf';low.frequency.value=250;high=ctx.createBiquadFilter();high.type='highshelf';high.frequency.value=4000;gain=ctx.createGain();gain.gain.value=0.9;echoDelay=ctx.createDelay();echoDelay.delayTime.value=0.25;let echoGain=ctx.createGain();echoGain.gain.value=0;window.echoGain=echoGain;src.connect(low);low.connect(high);high.connect(gain);gain.connect(ctx.destination);gain.connect(dest);gain.connect(echoDelay);echoDelay.connect(echoGain);echoGain.connect(gain);}
document.getElementById('play').onclick=()=>{init();player.paused?player.play():player.pause();};
document.getElementById('abbey').onclick=function(){init();abbeyOn=!abbeyOn;low.gain.value=abbeyOn?3.5:0;high.gain.value=abbeyOn?-1.8:0;this.textContent=abbeyOn?'🎛️ ABBEY ROAD: ON WARM':'🎛️ ABBEY ROAD: OFF';this.style.background=abbeyOn?'#ffd700':'#ff9500';};
document.getElementById('mic').onclick=async function(){init();if(!micOn){let s=await navigator.mediaDevices.getUserMedia({audio:true});let m=ctx.createMediaStreamSource(s);m.connect(gain);micS=s;micOn=true;this.textContent='🎤 MIC LIVE';this.style.background='#00ff88';}else{micS.getTracks().forEach(t=>t.stop());micOn=false;this.textContent='🎤 STUDIO MIC OFF';this.style.background='#222';}};
document.getElementById('echo').onclick=function(){init();echoOn=!echoOn;window.echoGain.gain.value=echoOn?0.3:0;this.textContent=echoOn?'🎧 DJ ECHO ON':'🎧 DJ ECHO OFF';this.style.background=echoOn?'#00ff88':'#222';};
document.getElementById('rec').onclick=function(){init();if(recorder&&recorder.state=='recording'){recorder.stop();this.textContent='⏺️ RECORD OFF';this.style.background='#222';}else{chunks=[];recorder=new MediaRecorder(dest.stream);recorder.ondataavailable=e=>chunks.push(e.data);recorder.onstop=()=>{let b=new Blob(chunks,{type:'audio/webm'});let u=URL.createObjectURL(b);let a=document.createElement('a');a.href=u;a.download='SIRDIO-SESSION-'+Date.now()+'.webm';a.textContent='⬇️ DOWNLOAD RECORDING';a.style.display='block';a.style.background='#00ff88';a.style.color='#000';a.style.padding='12px';a.style.marginTop='8px';a.style.textAlign='center';a.style.borderRadius='8px';document.getElementById('st').appendChild(a);};recorder.start();this.textContent='⏺️ RECORDING... TAP TO STOP';this.style.background='#ff0000';}};

document.getElementById('live').onclick=function(){init();liveOn=!liveOn;this.textContent=liveOn?'🟢 LIVE NOW - TAP TO STOP':'🔴 GO LIVE - BROADCAST';this.style.background=liveOn?'#00ff88':'#ff0000';this.style.color=liveOn?'#000':'#fff';};

peer=new Peer('sirdio-studio-b-master');
peer.on('open',id=>{document.getElementById('myId').textContent=id;});
peer.on('connection',conn=>{
conn.on('data',d=>{
if(d.type==='guest-request'){
pendingGuest=d.peerId;
document.getElementById('guestBox').innerHTML=`<button id="approve" class="redBlink">🔴 GUEST REQUESTING - TAP TO MAKE GREEN & LIVE<br><small>${d.peerId.slice(0,8)}</small></button>`;
document.getElementById('approve').onclick=()=>{
let call=peer.call(d.peerId,dest.stream);
call.on('stream',s=>{document.getElementById('guestAudio').srcObject=s;if(ctx){let gs=ctx.createMediaStreamSource(s);gs.connect(gain);}});
document.getElementById('guestBox').innerHTML=`<button class="greenLive">🟢 GUEST LIVE - ${d.peerId.slice(0,8)} - ON AIR</button>`;
};
}
});
});
peer.on('call',call=>{
if(call.metadata&&call.metadata.type==='listener'){
call.answer(dest?dest.stream:null);document.getElementById('cnt').textContent=parseInt(document.getElementById('cnt').textContent)+1;
}
});
</script></body></html>
