<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SIRDIO STUDIO B - LIGHT</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>*{box-sizing:border-box}body{margin:0;background:#0a0a0a;color:#fff;font-family:system-ui;padding:10px}
.card{background:#151515;border-radius:12px;padding:12px;margin:8px 0;border:1px solid #222}
.btn{padding:14px 18px;border-radius:10px;border:0;font-weight:800;margin:3px;cursor:pointer}
.g{background:#00ff88;color:#000}.o{background:#ff9500;color:#000}.r{background:#222;color:#fff}
.abbeyOn{background:linear-gradient(90deg,#ff9500,#ffd700);color:#000}
.item{display:flex;justify-content:space-between;padding:7px;background:#000;margin:4px 0;border-radius:8px;font-size:13px}
input{padding:10px;border-radius:8px;border:1px solid #333;background:#000;color:#fff;width:100%}</style></head><body>
<h2>🎙️ SIRDIO STUDIO B</h2>
<div class="card" style="border:2px solid #ff9500">
<div style="display:flex;flex-wrap:wrap">
<button id="play" class="btn g">▶ PLAY DECK</button>
<button id="abbey" class="btn o">🎛️ ABBEY ROAD: OFF</button>
<button id="myMic" class="btn r">MY MIC OFF</button>
<button id="goLive" class="btn r">🔴 GO LIVE</button>
</div>
<audio id="player" controls style="width:100%;margin-top:10px"></audio>
<p id="st">Ready - Light CPU Mode</p>
<p style="font-size:11px">ID: <b id="myId" style="color:#00ff88"></b> | <b id="mode" style="color:#ff9500">CLEAN</b></p>
</div>
<div class="card"><h3>🎵 PLAYLIST - Add More Audio</h3>
<input id="url" placeholder="Paste MP3 URL"><input type="file" id="files" accept="audio/*" multiple style="margin-top:6px">
<button id="add" class="btn g">+ ADD TO PLAYLIST</button><div id="pl"></div></div>
<div class="card"><h3>👥 GUEST MIC</h3><div id="guests">Waiting for WhatsApp 026 705 2785</div><audio id="guestAudio" controls autoplay style="width:100%;margin-top:6px"></audio><p style="font-size:11px">Listeners: <span id="lCount">0</span></p></div>
<script>
let playlist=JSON.parse(localStorage.getItem('sirdio_pl')||'["ALHA-01.mp3"]'),cur=0;
const player=document.getElementById('player');let audioCtx,src,gain,lowF,highF,sat,comp,dest,myMicS,myOn=false,abbeyOn=false;
function tapeCurve(){let c=new Float32Array(44100);for(let i=0;i<44100;i++){let x=i*2/44100-1;c[i]=Math.tanh(x*1.2);}return c;}
function render(){document.getElementById('pl').innerHTML=playlist.map((t,i)=>`<div class="item"><span>${i==cur?'▶ ':''}${t.split('/').pop().slice(0,28)}</span><span><button onclick="playT(${i})" class="btn g" style="padding:3px 7px">PLAY</button><button onclick="delT(${i})" class="btn r" style="padding:3px 7px">X</button></span></div>`).join('');localStorage.setItem('sirdio_pl',JSON.stringify(playlist));if(playlist[cur])player.src=playlist[cur];}
window.playT=i=>{cur=i;render();player.play();init();};window.delT=i=>{playlist.splice(i,1);render();};
document.getElementById('add').onclick=()=>{let u=document.getElementById('url').value.trim();if(u){playlist.push(u);document.getElementById('url').value='';render();}};
document.getElementById('files').onchange=e=>{for(let f of e.target.files)playlist.push(URL.createObjectURL(f));render();};
function init(){if(audioCtx)return;audioCtx=new(window.AudioContext||window.webkitAudioContext)();dest=audioCtx.createMediaStreamDestination();src=audioCtx.createMediaElementSource(player);lowF=audioCtx.createBiquadFilter();lowF.type='lowshelf';lowF.frequency.value=250;highF=audioCtx.createBiquadFilter();highF.type='highshelf';highF.frequency.value=4000;sat=audioCtx.createWaveShaper();sat.curve=tapeCurve();sat.oversample='2x';comp=audioCtx.createDynamicsCompressor();comp.threshold.value=-20;comp.ratio.value=2.5;gain=audioCtx.createGain();gain.gain.value=0.9;src.connect(lowF);lowF.connect(highF);highF.connect(sat);sat.connect(comp);comp.connect(gain);gain.connect(audioCtx.destination);gain.connect(dest);}
document.getElementById('play').onclick=()=>{init();player.paused?player.play():player.pause();};
document.getElementById('abbey').onclick=function(){init();abbeyOn=!abbeyOn;if(abbeyOn){lowF.gain.value=3;highF.gain.value=-1.5;gain.gain.value=1.1;this.textContent='🎛️ ABBEY ROAD: ON - WARM';this.className='btn abbeyOn';document.getElementById('mode').textContent='ABBEY ROAD ANALOG - WARM CLEAN';document.getElementById('st').textContent='🎛️ Abbey Road ON - Tape + REDD Console - Clean No Distortion - Light CPU';}else{lowF.gain.value=0;highF.gain.value=0;gain.gain.value=0.9;this.textContent='🎛️ ABBEY ROAD: OFF';this.className='btn o';document.getElementById('mode').textContent='CLEAN';document.getElementById('st').textContent='Clean mode - Light CPU';}};
document.getElementById('myMic').onclick=async function(){init();if(!myOn){let s=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,sampleRate:48000}});let ms=audioCtx.createMediaStreamSource(s);ms.connect(gain);myMicS=s;myOn=true;this.textContent='MY MIC LIVE';this.style.background='#00ff88';}else{myMicS.getTracks().forEach(t=>t.stop());myOn=false;this.textContent='MY MIC OFF';this.style.background='#222';}};
render();
let peer=new Peer('sirdio-studio-b-master');peer.on('open',id=>{document.getElementById('myId').textContent=id;});
peer.on('call',call=>{let isL=call.metadata&&call.metadata.type==='listener';if(isL){call.answer(dest?.stream||null);document.getElementById('lCount').textContent=parseInt(document.getElementById('lCount').textContent)+1;}else{call.answer(dest?.stream||null);call.on('stream',s=>{document.getElementById('guestAudio').srcObject=s;document.getElementById('guests').innerHTML=`<b style="color:#00ff88">✅ GUEST LIVE: ${call.peer}</b>`;if(audioCtx){let gs=audioCtx.createMediaStreamSource(s);gs.connect(gain);}});}});
</script></body></html>
