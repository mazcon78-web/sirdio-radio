<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SIRDIO STUDIO - SIMPLE POWERFUL</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
body{background:#000;color:#fff;font-family:Arial;text-align:center;padding:15px}
.card{max-width:380px;margin:auto;background:#111;border:2px solid #ff6600;border-radius:20px;padding:20px}
audio{width:100%;margin:10px 0}
.btn{width:100%;padding:18px;margin:8px 0;border-radius:12px;font-weight:900;font-size:16px;border:none}
#play{background:#fff;color:#000}
#mic{background:#222;color:#ff6600;border:2px solid #ff6600}
#mic.on{background:#00FF66;color:#000;border-color:#00FF66}
#abbey{background:#222;color:#555;border:2px solid #333}
#abbey.on{background:#ff6600;color:#000;box-shadow:0 0 20px #ff6600}
#live{background:#00FF66;color:#000;margin-top:15px}
#vu{height:8px;background:#222;border-radius:4px;overflow:hidden;margin:10px 0}
#vuF{height:100%;width:30%;background:#00FF66}
</style></head><body>
<h2 style="color:#ff6600">SIRDIO STUDIO B</h2>
<p style="color:#888">SIMPLE • POWERFUL • LOUD</p>
<div class="card">
<audio id="p" controls loop src="ALHA-01.mp3"></audio>
<div id="vu"><div id="vuF"></div></div>
<div id="info" style="font-size:12px;color:#888">Ready • Loop Forever ON</div>
<button class="btn" id="play">▶️ PLAY</button>
<button class="btn" id="mic">🎙️ MIC OFF</button>
<button class="btn" id="abbey">🔥 ABBEY ROAD - TAP FOR WARM LOUD</button>
<button class="btn" id="live">📡 GO LIVE</button>
<div id="s" style="margin-top:10px;color:#00FF66;font-size:12px"></div>
</div>
<script>
let p=document.getElementById('p'),mic=document.getElementById('mic'),abbey=document.getElementById('abbey'),s=document.getElementById('s'),vuF=document.getElementById('vuF');
let ctx,bass,treb,comp,gain,anal,micOn=false,abbeyOn=false,peer,stream;
p.loop=true;
function init(){
 if(ctx) return;
 ctx=new AudioContext();
 bass=ctx.createBiquadFilter(); bass.type='lowshelf'; bass.frequency.value=120; bass.gain.value=0;
 treb=ctx.createBiquadFilter(); treb.type='highshelf'; treb.frequency.value=3000; treb.gain.value=0;
 comp=ctx.createDynamicsCompressor(); comp.threshold.value=-20; comp.ratio.value=4;
 gain=ctx.createGain(); anal=ctx.createAnalyser();
 try{let src=ctx.createMediaElementSource(p); src.connect(bass); bass.connect(treb); treb.connect(comp); comp.connect(gain); gain.connect(anal); anal.connect(ctx.destination);}catch(e){}
}
document.getElementById('play').onclick=()=>{init(); if(p.paused){p.play(); event.target.textContent='⏸️ PAUSE'}else{p.pause(); event.target.textContent='▶️ PLAY'} if(ctx.state=='suspended')ctx.resume();};
abbey.onclick=()=>{
 init(); abbeyOn=!abbeyOn;
 if(abbeyOn){bass.gain.value=6; treb.gain.value=3; gain.gain.value=2.5; abbey.textContent='🔥 ABBEY ROAD ON - WARM & LOUD!'; abbey.classList.add('on'); document.getElementById('info').textContent='🔥 LOUD MODE ON';}
 else{bass.gain.value=0; treb.gain.value=0; gain.gain.value=1; abbey.textContent='🔥 ABBEY ROAD - TAP FOR WARM LOUD'; abbey.classList.remove('on'); document.getElementById('info').textContent='Bypassed';}
};
mic.onclick=async()=>{
 init();
 if(!micOn){
  try{stream=await navigator.mediaDevices.getUserMedia({audio:true}); let ms=ctx.createMediaStreamSource(stream); ms.connect(bass); micOn=true; mic.textContent='🟢 MIC LIVE - TALK!'; mic.classList.add('on'); p.volume=0.15;}catch(e){alert(e.message)}
 }else{stream.getTracks().forEach(t=>t.stop()); micOn=false; mic.textContent='🎙️ MIC OFF'; mic.classList.remove('on'); p.volume=1;}
};
document.getElementById('live').onclick=()=>{
 if(peer) return;
 peer=new Peer('sirdio-studio-b-master'); peer.on('open',id=>{s.textContent='🔴 LIVE ID:'+id+' - Listeners can join now!';});
 peer.on('call',c=>{let d=ctx.createMediaStreamDestination(); try{gain.connect(d);}catch(e){} c.answer(stream||d.stream);});
};
setInterval(()=>{if(!anal) return; let d=new Uint8Array(anal.frequencyBinCount); anal.getByteFrequencyData(d); let a=d.reduce((x,y)=>x+y,0)/d.length; vuF.style.width=Math.min(100,a*1.2)+'%';},100);
</script></body></html>
