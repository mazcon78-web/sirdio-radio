<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SIRDIO STUDIO B</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>body{margin:0;background:#0a0a0a;color:#fff;font-family:system-ui;padding:10px}
.card{background:#151515;border-radius:12px;padding:12px;margin:8px 0;border:1px solid #222}
.btn{padding:14px 18px;border-radius:12px;border:0;font-weight:900;margin:4px;cursor:pointer}
.g{background:#00ff88;color:#000}.o{background:#ff9500;color:#000}.live{width:100%;padding:20px;font-size:18px;background:#ff0000;color:#fff;margin-top:12px}
.r{background:#222;color:#fff}.abbey{background:#ffd700;color:#000}</style></head><body>
<h2>🎙️ SIRDIO STUDIO B - LIGHT</h2>
<div class="card">
<audio id="player" src="./ALHA-01.mp3" controls style="width:100%"></audio>
<div style="display:flex;flex-wrap:wrap">
<button id="play" class="btn g">▶ PLAY DECK</button>
<button id="abbey" class="btn o">🎛️ ABBEY ROAD: OFF</button>
<button id="myMic" class="btn r">🎤 MY MIC OFF</button>
</div>
<button id="goLive" class="btn live">🔴 GO LIVE - START BROADCAST</button>
<p id="st">Ready - Tap PLAY DECK first</p>
<p style="font-size:11px">ID: <b id="myId" style="color:#00ff88">loading...</b> | Listeners: <span id="cnt">0</span></p>
</div>
<div class="card"><h3>👥 GUEST MIC - WhatsApp 0267052785</h3><div id="guests">No guest</div><audio id="guestAudio" controls autoplay style="width:100%"></audio></div>

<script>
const player=document.getElementById('player');
let ctx,src,gain,low,high,dest,myStream,myOn=false,abbeyOn=false,liveOn=false;
function init(){if(ctx)return;ctx=new(window.AudioContext||window.webkitAudioContext)();dest=ctx.createMediaStreamDestination();src=ctx.createMediaElementSource(player);low=ctx.createBiquadFilter();low.type='lowshelf';low.frequency.value=250;high=ctx.createBiquadFilter();high.type='highshelf';high.frequency.value=4000;gain=ctx.createGain();gain.gain.value=0.9;src.connect(low);low.connect(high);high.connect(gain);gain.connect(ctx.destination);gain.connect(dest);}
player.oncanplay=()=>{document.getElementById('st').textContent='✅ ALHA-01 loaded - Ready';};
player.onerror=()=>{document.getElementById('st').textContent='❌ Enable Pages: Settings > Pages > main / root';};

document.getElementById('play').onclick=()=>{init();player.paused?player.play():player.pause();};
document.getElementById('abbey').onclick=function(){init();abbeyOn=!abbeyOn;low.gain.value=abbeyOn?3:0;high.gain.value=abbeyOn?-1.5:0;this.textContent=abbeyOn?'🎛️ ABBEY ROAD: ON - WARM':'🎛️ ABBEY ROAD: OFF';this.className=abbeyOn?'btn abbey':'btn o';};
document.getElementById('myMic').onclick=async function(){init();if(!myOn){let s=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});let m=ctx.createMediaStreamSource(s);m.connect(gain);myStream=s;myOn=true;this.textContent='🎤 MY MIC LIVE';this.style.background='#00ff88';}else{myStream.getTracks().forEach(t=>t.stop());myOn=false;this.textContent='🎤 MY MIC OFF';this.style.background='#222';}};
document.getElementById('goLive').onclick=function(){init();liveOn=!liveOn;if(liveOn){this.textContent='🔴 LIVE NOW - TAP TO STOP';this.style.background='#00ff88';this.style.color='#000';document.getElementById('st').textContent='🔴 BROADCASTING - Share listener link!';}else{this.textContent='🔴 GO LIVE - START BROADCAST';this.style.background='#ff0000';this.style.color='#fff';}};

let peer=new Peer('sirdio-studio-b-master');peer.on('open',id=>{document.getElementById('myId').textContent=id;});
peer.on('call',call=>{call.answer(dest?dest.stream:player.srcObject||null);if(call.metadata&&call.metadata.type==='listener'){document.getElementById('cnt').textContent=parseInt(document.getElementById('cnt').textContent)+1;}else{call.on('stream',s=>{document.getElementById('guestAudio').srcObject=s;document.getElementById('guests').innerHTML='<b style="color:#00ff88">✅ GUEST LIVE</b>';if(ctx){let gs=ctx.createMediaStreamSource(s);gs.connect(gain);}});}});
</script></body></html>
