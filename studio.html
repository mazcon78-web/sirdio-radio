<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SIRDIO STUDIO B -  </title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>*{box-sizing:border-box}body{margin:0;background:#0a0a0a;color:#fff;font-family:system-ui;padding:10px}
.card{background:#151515;border-radius:12px;padding:12px;margin:8px 0;border:1px solid #222}
.btn{padding:12px 16px;border-radius:10px;border:0;font-weight:800;margin:3px;cursor:pointer}
.g{background:#00ff88;color:#000}.o{background:#ff9500;color:#000}.r{background:#222;color:#fff}.abbey{background:linear-gradient(90deg,#ff9500,#ffd700);color:#000;font-weight:900}
input{padding:10px;border-radius:8px;border:1px solid #333;background:#000;color:#fff;width:100%}
.item{display:flex;justify-content:space-between;padding:7px;background:#000;margin:4px 0;border-radius:8px;font-size:13px}
.knob{display:flex;flex-direction:column;align-items:center;flex:1}
</style></head><body>
<h2>🎙️ SIRDIO STUDIO B -  ANALOG</h2>
<div class="card" style="border:2px solid #ff9500">
<div style="display:flex;flex-wrap:wrap;gap:4px">
<button id="play" class="btn g">▶ PLAY DECK</button>
<button id="abbey" class="btn abbey">🎛️  ROAD: OFF</button>
<button id="myMic" class="btn r">MY MIC OFF</button>
<button id="goLive" class="btn r">🔴 GO LIVE</button>
</div>
<div style="display:flex;gap:8px;margin-top:10px;background:#000;padding:10px;border-radius:10px">
<div class="knob"><label style="font-size:10px">TAPE SAT</label><input id="sat" type="range" min="0" max="100" value="30"><span id="satV" style="font-size:10px">30%</span></div>
<div class="knob"><label style="font-size:10px">CONSOLE WARM</label><input id="warm" type="range" min="0" max="10" value="3"><span id="warmV" style="font-size:10px">+3dB</span></div>
<div class="knob"><label style="font-size:10px">J37 ECHO</label><input id="echo" type="range" min="0" max="100" value="0"><span id="echoV" style="font-size:10px">OFF</span></div>
<div class="knob"><label style="font-size:10px">VINYL CRACKLE</label><input id="vinyl" type="range" min="0" max="100" value="0"><span id="vinylV" style="font-size:10px">OFF</span></div>
</div>
<audio id="player" controls style="width:100%;margin-top:8px"></audio>
<p id="st">Abbey Road Analog Chain Ready - Clean No Distortion</p>
<p style="font-size:11px">ID: <b id="myId" style="color:#00ff88"></b> | <span id="mode" style="color:#ff9500">CLEAN</span></p>
</div>
<div class="card"><h3>🎵 DJ PLAYLIST - Add More Audio</h3><input id="url" placeholder="Paste MP3 URL"><input type="file" id="files" accept="audio/*" multiple style="margin-top:6px"><button id="add" class="btn g">+ ADD</button><div id="pl"></div></div>
<div class="card" style="border-color:#ff9500"><h3>👥 GUESTS + LISTENERS</h3><div id="guests">Waiting WhatsApp 026 705 2785</div><audio id="guestAudio" controls autoplay style="width:100%"></audio><p>Listeners: <span id="lCount">0</span></p></div>
<script>
let playlist=JSON.parse(localStorage.getItem('sirdio_pl')||'["ALHA-01.mp3"]'),cur=0;
const player=document.getElementById('player');let audioCtx,src,gain,lowShelf,highShelf,saturator,delay,delayGain,compressor,dest,myMicStream,myMicOn=false,abbeyOn=false;
function tapeSaturationCurve(amount){let k=amount/100*1.5;let n=44100,curve=new Float32Array(n);for(let i=0;i<n;i++){let x=i*2/n-1;curve[i]=(3+k)*x*20*(Math.PI/180)/(Math.PI+ k*Math.abs(x));}return curve;}
function render(){document.getElementById('pl').innerHTML=playlist.map((t,i)=>`<div class="item"><span>${i==cur?'▶ ':''}${t.split('/').pop().slice(0,30)}</span><span><button onclick="playT(${i})" class="btn g" style="padding:2px 6px">PLAY</button><button onclick="delT(${i})" class="btn r" style="padding:2px 6px">X</button></span></div>`).join('');localStorage.setItem('sirdio_pl',JSON.stringify(playlist));if(playlist[cur])player.src=playlist[cur];}
window.playT=i=>{cur=i;render();player.play();init();};window.delT=i=>{playlist.splice(i,1);render();};
document.getElementById('add').onclick=()=>{let u=document.getElementById('url').value.trim();if(u){playlist.push(u);document.getElementById('url').value='';render();}};
document.getElementById('files').onchange=e=>{for(let f of e.target.files)playlist.push(URL.createObjectURL(f));render();};
function init(){if(audioCtx)return;audioCtx=new(window.AudioContext||window.webkitAudioContext)();dest=audioCtx.createMediaStreamDestination();src=audioCtx.createMediaElementSource(player);lowShelf=audioCtx.createBiquadFilter();lowShelf.type='lowshelf';lowShelf.frequency.value=250;lowShelf.gain.value=0;highShelf=audioCtx.createBiquadFilter();highShelf.type='highshelf';highShelf.frequency.value=4000;highShelf.gain.value=0;saturator=audioCtx.createWaveShaper();saturator.curve=tapeSaturationCurve(30);saturator.oversample='4x';compressor=audioCtx.createDynamicsCompressor();compressor.threshold.value=-24;compressor.knee.value=30;compressor.ratio.value=3;compressor.attack.value=0.01;compressor.release.value=0.25;delay=audioCtx.createDelay();delay.delayTime.value=0.35;delayGain=audioCtx.createGain();delayGain.gain.value=0;gain=audioCtx.createGain();gain.gain.value=0.9;src.connect(lowShelf);lowShelf.connect(highShelf);highShelf.connect(saturator);saturator.connect(compressor);compressor.connect(gain);gain.connect(audioCtx.destination);gain.connect(dest);compressor.connect(delay);delay.connect(delayGain);delayGain.connect(audioCtx.destination);delayGain.connect(dest);}
document.getElementById('play').onclick=()=>{init();player.paused?player.play():player.pause();};
document.getElementById('abbey').onclick=function(){abbeyOn=!abbeyOn;if(!audioCtx)init();if(abbeyOn){this.textContent='🎛️ ABBEY ROAD: ON - ANALOG VIBES 🔥';lowShelf.gain.value=3;highShelf.gain.value=-2;saturator.curve=tapeSaturationCurve(parseInt(document.getElementById('sat').value));gain.gain.value=1.15;document.getElementById('mode').textContent='ABBEY ROAD - Tape 30% + Console Warm + No Distortion';document.getElementById('st').textContent='🎛️ WARM MODE - Abbey Road J37 Tape + REDD Console - CLEAN NO CRACKLE';}else{this.textContent='🎛️ ABBEY ROAD: OFF';lowShelf.gain.value=0;highShelf.gain.value=0;saturator.curve=tapeSaturationCurve(0);gain.gain.value=0.9;document.getElementById('mode').textContent='CLEAN';}};
document.getElementById('sat').oninput=e=>{document.getElementById('satV').textContent=e.target.value+'%';if(saturator&&abbeyOn)saturator.curve=tapeSaturationCurve(e.target.value);};
document.getElementById('warm').oninput=e=>{document.getElementById('warmV').textContent='+'+e.target.value+'dB';if(lowShelf)lowShelf.gain.value=e.target.value;};
document.getElementById('echo').oninput=e=>{document.getElementById('echoV').textContent=e.target.value==0?'OFF':e.target.value+'%';if(delayGain)delayGain.gain.value=e.target.value/200;};
document.getElementById('vinyl').oninput=e=>{document.getElementById('vinylV').textContent=e.target.value==0?'OFF':e.target.value+'%';};
document.getElementById('myMic').onclick=async function(){if(!myMicOn){let s=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,sampleRate:48000}});init();let ms=audioCtx.createMediaStreamSource(s);ms.connect(gain);myMicStream=s;myMicOn=true;this.textContent='MY MIC LIVE';this.style.background='#00ff88';}else{myMicStream.getTracks().forEach(t=>t.stop());myMicOn=false;this.textContent='MY MIC OFF';this.style.background='#222';}};
render();
let peer=new Peer('sirdio-studio-b-master');peer.on('open',id=>{document.getElementById('myId').textContent=id;document.getElementById('st').textContent='Studio ONLINE with Abbey Road Analog Vibes - Ready';});
peer.on('call',call=>{let isL=call.metadata&&call.metadata.type==='listener';if(isL){call.answer(dest?.stream||null);document.getElementById('lCount').textContent=parseInt(document.getElementById('lCount').textContent)+1;}else{call.answer(dest?.stream||null);call.on('stream',stream=>{document.getElementById('guestAudio').srcObject=stream;document.getElementById('guests').innerHTML=`<b style="color:#00ff88">✅ GUEST ON AIR: ${call.peer} - ABBEY ROAD VIBES!</b>`;if(audioCtx){let gs=audioCtx.createMediaStreamSource(stream);gs.connect(gain);}});}});
</script></body></html>
