<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIRDIO STUDIO B - ABBEY ROAD</title></head>
<body style="background:radial-gradient(circle,#222,#000);color:#fff;text-align:center;padding:10px;font-family:sans-serif;margin:0">
<h1 style="color:#FF6A00;text-shadow:0 0 20px #FF6A00;margin:15px 0 5px 0">SIRDIO STUDIO B</h1>
<p style="color:#FF6A00;letter-spacing:3px;font-size:10px;margin:0">ABBEY ROAD ANALOG LOUD EDITION</p>

<div style="background:linear-gradient(145deg,#2a2a2a,#111);border:3px solid #FF6A00;border-radius:20px;padding:15px;margin:15px 0;box-shadow:inset 0 0 20px #000,0 0 20px #FF6A0055">
<p style="margin:0 0 10px 0;color:#00FF00;font-weight:bold">● ABBEY ROAD CONSOLE - LOUD</p>
<audio id="a" src="./ALHA-01.mp3" loop style="width:100%"></audio>
<div style="display:flex;gap:8px;margin-top:10px">
<button onclick="document.getElementById('a').play();document.getElementById('a').volume=1" style="flex:1;padding:14px;background:#FF6A00;border:none;border-radius:12px;color:#fff;font-weight:900;font-size:16px">▶ PLAY LOUD</button>
<button onclick="document.getElementById('a').pause()" style="flex:1;padding:14px;background:#333;border-radius:12px;color:#fff;border:1px solid #555">⏸ PAUSE</button>
</div>
<div style="margin-top:12px;background:#000;border-radius:10px;padding:10px;border:1px solid #333">
<p style="font-size:10px;opacity:0.5;margin:0 0 5px 0">ANALOG VU METER</p>
<div style="height:20px;background:#111;border-radius:10px;overflow:hidden;display:flex;gap:2px"><div id="vu" style="width:30%;height:100%;background:linear-gradient(90deg,#00FF00,#FFFF00,#FF6A00,#FF0000);transition:width 0.2s"></div></div>
</div>
<div style="margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:10px">
<div style="background:#000;border-radius:12px;padding:10px;border:1px solid #FF6A00"><p style="margin:0;font-size:10px;color:#FF6A00">VOLUME</p><input type="range" min="0" max="100" value="100" oninput="document.getElementById('a').volume=this.value/100" style="width:100%;accent-color:#FF6A00"></div>
<div style="background:#000;border-radius:12px;padding:10px;border:1px solid #FF6A00"><p style="margin:0;font-size:10px;color:#FF6A00">BASS BOOST</p><input type="range" min="0" max="100" value="60" style="width:100%;accent-color:#FF6A00"></div>
</div>
<button id="loud" onclick="let aud=document.getElementById('a');if(this.innerText.includes('LOUD OFF')){this.innerText='🔊 ABBEY ROAD LOUD ON';this.style.background='#FF6A00';aud.volume=1}else{this.innerText='💥 LOUD OFF - MAX POWER!';this.style.background='#FF0000';aud.volume=1;alert('ABBEY ROAD LOUD! Bass + Volume MAX! 🔊🔥')}" style="margin-top:12px;width:100%;padding:15px;background:#FF6A00;border:none;border-radius:15px;color:#fff;font-weight:900;font-size:14px;box-shadow:0 0 15px #FF6A00">🔊 ABBEY ROAD LOUD ON</button>
</div>

<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
<button onclick="navigator.mediaDevices.getUserMedia({audio:true}).then(()=>{this.innerText='🎙️ MIC LIVE';this.style.background='#00FF00';this.style.color='#000'}).catch(()=>alert('Allow mic'))" style="padding:16px;background:#111;border:2px solid #FF6A00;border-radius:15px;color:#FF6A00;font-weight:900">🎙️ MIC</button>
<button style="padding:16px;background:#FF0000;border:none;border-radius:15px;color:white;font-weight:900">🔴 REC</button>
</div>
<p style="margin-top:15px;background:#FF6A00;padding:10px;border-radius:10px;color:#000;font-weight:900;font-size:11px">https://mazcon78-web.github.io/sirdio-radio/</p>
<script>setInterval(()=>{let vu=document.getElementById('vu');if(vu){let w=20+Math.random()*80;vu.style.width=w+'%'}},200)</script>
</body></html>
