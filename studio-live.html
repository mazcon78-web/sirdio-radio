<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIRDIO LIVE BROADCAST</title><script src="https://unpkg.com/peerjs@1.5.3/dist/peerjs.min.js"></script></head>
<body style="background:#000;color:#fff;text-align:center;padding:12px;font-family:sans-serif">
<h1 style="color:#FF0000;text-shadow:0 0 15px red">🔴 SIRDIO LIVE</h1>
<p style="color:#FF6A00;font-size:11px">ABBEY ROAD LIVE BROADCAST</p>
<div style="background:#1a1a1a;border:3px solid red;border-radius:20px;padding:15px;margin-top:10px">
<p id="id" style="background:#000;padding:10px;border-radius:10px;color:#0f0;font-size:12px">Connecting...</p>
<audio id="music" src="./ALHA-01.mp3" loop controls style="width:100%;margin-top:10px"></audio>
<button id="liveBtn" style="width:100%;margin-top:15px;padding:18px;background:red;border:none;border-radius:15px;color:#fff;font-weight:900;font-size:18px">🔴 GO LIVE - MIC TO WORLD</button>
<p id="status" style="margin-top:10px;color:#FF6A00;font-weight:bold">Ready to go LIVE</p>
<div style="background:#000;border-radius:10px;padding:8px;margin-top:10px"><div id="vu" style="height:20px;width:30%;background:linear-gradient(90deg,#0f0,#ff0,#f00);border-radius:10px"></div></div>
</div>
<p style="background:#FF6A00;color:#000;padding:10px;border-radius:10px;margin-top:15px;font-weight:900;font-size:11px">Fans listen at: /live.html</p>
<script>
let peer=new Peer('sirdio-studio-b-live-10020');
peer.on('open',i=>{document.getElementById('id').innerText='LIVE ID: '+i+'\nShare this to fans: sirdio-studio-b-live-10020';});
let stream,callList=[];
document.getElementById('liveBtn').onclick=async()=>{
let musicEl=document.getElementById('music');
let mic=await navigator.mediaDevices.getUserMedia({audio:true});
let ctx=new AudioContext();
let dest=ctx.createMediaStreamDestination();
ctx.createMediaStreamSource(mic).connect(dest);
if(!musicEl.paused){let msrc=ctx.createMediaElementSource(musicEl);msrc.connect(dest);msrc.connect(ctx.destination);}
stream=dest.stream;
document.getElementById('status').innerText='🔴 LIVE ON AIR! Fans can hear you!';
document.getElementById('liveBtn').style.background='#0f0';document.getElementById('liveBtn').innerText='🟢 LIVE - ON AIR';
};
peer.on('connection',c=>{});
peer.on('call',c=>{if(stream)c.answer(stream);});
setInterval(()=>{document.getElementById('vu').style.width=(20+Math.random()*80)+'%'},150);
</script></body></html>peer.on('call',c=>{c.answer(stream);status.innerText='CONNECTED!'});
