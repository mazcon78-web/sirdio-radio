<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIRDIO STUDIO</title><script src="https://unpkg.com/peerjs@1.5.3/dist/peerjs.min.js"></script></head><body style="background:#111;color:#fff;text-align:center;padding:15px;font-family:sans-serif"><h2 style="color:#0f0">🎙️ SIRDIO STUDIO B</h2><button id="liveBtn" style="width:100%;padding:18px;background:#0f0;color:#000;font-weight:900;border:none;border-radius:10px;font-size:16px">🔴 TAP TO GO LIVE (MIC)</button><p id="status" style="color:orange">OFFLINE - Tap to Go Live</p><hr style="margin:15px 0"><h3>🎵 PLAYLIST</h3><input type="file" id="musicFile" accept="audio/*" multiple style="width:100%;padding:10px;background:#222;color:#fff"><audio id="player" controls style="width:100%;margin:10px 0"></audio><button id="playBtn" style="padding:10px 20px;background:#00f;color:#fff;border:none;border-radius:5px">▶️ Play to Fans</button><p style="font-size:12px;color:#aaa">1. Go LIVE first (green)<br>2. Then choose music or talk mic</p><script>let peer,localStream,currentAudioStream;let music=document.getElementById('player');liveBtn.onclick=async()=>{try{let s=await navigator.mediaDevices.getUserMedia({audio:true});localStream=s;let p=new Peer('sirdio-studio-b-live-10020');peer=p;p.on('open',()=>{liveBtn.style.background='red';liveBtn.innerText='🟢 ON AIR - LIVE';status.innerText='🟢 ON AIR - Fans can connect now!';});p.on('call',call=>{let sendStream=currentAudioStream||localStream;call.answer(sendStream);});}catch(e){alert('Mic error: '+e.message)}};playBtn.onclick=()=>{if(music.src){let audioCtxStream=music.captureStream?music.captureStream():music.mozCaptureStream?music.mozCaptureStream():null;if(audioCtxStream){currentAudioStream=audioCtxStream;status.innerText='🎵 Playing Music to Fans';}music.play();}else alert('Choose music file first');};musicFile.onchange=e=>{let f=e.target.files[0];if(f){music.src=URL.createObjectURL(f);}};</script></body></html>
