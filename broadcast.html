<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIR FLAVE STUDIO</title><script src="https://unpkg.com/peerjs@1.5.3/dist/peerjs.min.js"></script><style>body{margin:0;background:#000;color:#fff;text-align:center;padding:20px;font-family:Arial}.box{background:#111;border:2px solid red;border-radius:20px;padding:30px;max-width:500px;margin:auto}button{width:100%;padding:25px;border-radius:50px;border:0;font-weight:900;font-size:20px;margin:15px 0} .start{background:red;color:#fff} .stop{background:#333;color:#fff}</style></head><body><div class="box"><h1>🎙️ SIR FLAVE STUDIO</h1><p id="msg" style="background:#222;padding:15px;border-radius:10px">Connecting...</p><div style="font-size:80px">🎤</div><button class="start" id="b1" onclick="live()">🔴 START LIVE</button><button class="stop" id="b2" style="display:none" onclick="location.reload()">⏹️ STOP LIVE</button><p>Listeners hearing you: <b id="num">0</b></p><p style="color:#666;font-size:12px">Keep this page OPEN while live!</p></div><script>let peer,stream,cons=[];function init(){peer=new Peer('SIRDIO-PLAY-LIVE',{config:{iceServers:[{urls:'stun:stun.l.google.com:19302'}]}});peer.on('open',()=>{document.getElementById('msg').innerText='✅ READY - Tap START LIVE';});peer.on('call',c=>{if(stream){c.answer(stream);cons.push(c);document.getElementById('num').innerText=cons.length}})}async function live(){stream=await navigator.mediaDevices.getUserMedia({audio:true});document.getElementById('msg').innerText='🔴 LIVE ON AIR - TALK NOW!';document.getElementById('b1').style.display='none';document.getElementById('b2').style.display='block';}init();</script></body></html>
