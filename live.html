<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SIRDIO LIVE</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>body{background:#000;color:#fff;text-align:center;padding:30px;font-family:Arial}.btn{width:100%;max-width:350px;padding:25px;background:#00FF66;color:#000;font-weight:900;border-radius:15px;border:none;font-size:18px;margin:20px 0}</style>
</head><body>
<h2 style="color:#00FF66">SIRDIO RADIO LIVE</h2>
<div id="st" style="color:#fa0">Ready to connect</div>
<button class="btn" id="b">TAP TO LISTEN LIVE</button>
<audio id="a" controls loop src="ALHA-01.mp3" style="width:100%;max-width:350px"></audio>
<p style="color:#555;font-size:12px">If studio offline, plays ALHA-01 mix</p>
<script>
let b=document.getElementById('b'),st=document.getElementById('st'),a=document.getElementById('a');
b.onclick=()=>{
 st.textContent='Connecting to Studio B...';
 let peer=new Peer('L-'+Math.random().toString(36).slice(2,5));
 peer.on('open',()=>{
  let call=peer.call('sirdio-studio-b-master',new MediaStream());
  call.on('stream',s=>{st.textContent='🔴 LIVE CONNECTED!'; b.textContent='🔴 LIVE!'; let au=new Audio(); au.srcObject=s; au.play(); a.pause();});
  call.on('error',()=>{st.textContent='Offline - Playing Mix'; a.play();});
 });
 setTimeout(()=>{if(st.textContent.includes('Connecting')){st.textContent='Offline - Playing Mix'; a.play();}},3000);
};
</script></body></html>
