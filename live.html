
<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIRDIO LIVE</title><script src="https://unpkg.com/peerjs@1.5.3/dist/peerjs.min.js"></script></head><body style="background:#000;color:#fff;text-align:center;padding:30px;font-family:sans-serif"><h1 style="color:#0f0">📻 SIRDIO RADIO LIVE</h1><p style="color:orange">🔴 Live from Studio B</p><audio id="audio" controls autoplay style="width:100%;margin:20px 0;background:#222"></audio><button id="btn" style="width:100%;padding:20px;background:#0f0;color:#000;font-weight:900;font-size:18px;border:none;border-radius:10px">▶️ TAP TO CONNECT & LISTEN</button><p id="st" style="margin-top:15px">Tap button to listen</p><script>let peer,call;btn.onclick=()=>{st.innerText='⏳ CONNECTING... (Make sure Studio is ON AIR)';btn.style.background='orange';let p=new Peer();p.on('open',()=>{st.innerText='📞 Calling Studio...';let emptyStream=new MediaStream();let c=p.call('sirdio-studio-b-live-10020',emptyStream);c.on('stream',s=>{audio.srcObject=s;audio.play().then(()=>{btn.style.background='red';btn.innerText='🔴 LIVE - CONNECTED';st.innerText='🔴 YOU ARE LISTENING LIVE! 🔊';}).catch(()=>{st.innerText='🔴 CONNECTED! Tap play on audio bar above';btn.style.background='red';});});c.on('close',()=>{st.innerText='❌ Studio ended live';btn.style.background='#0f0';});c.on('error',()=>{st.innerText='❌ Studio is OFFLINE! Ask DJ to GO LIVE first!';btn.style.background='red';});});p.on('error',e=>{st.innerText='❌ ERROR: Studio OFFLINE! '+e.type;});};</script></body></html>
