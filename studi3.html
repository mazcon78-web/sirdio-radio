<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>SIRDIO STUDIO B - FIXED</title><script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script></head><body style="background:#000;color:#fff;font-family:Arial;padding:10px"><h2 style="color:#ff6600;text-align:center">SIRDIO STUDIO B - ABBEY ROAD FIXED</h2><div style="max-width:500px;margin:auto;background:#111;border:2px solid #ff6600;border-radius:15px;padding:12px"><audio id="player" controls loop src="ALHA-01.mp3" style="width:100%"></audio><div style="height:18px;background:#000;margin:8px 0"><div id="vu" style="width:30%;height:100%;background:#00FF66"></div></div><button id="micBtn" style="width:48%;padding:12px;background:#222;color:#ff6600;border:2px solid #ff6600;border-radius:10px">MIC OFF</button><button id="recBtn" style="width:48%;padding:12px;background:#222;color:red;border:2px solid red;border-radius:10px">REC</button><button id="loudBtn" style="width:100%;padding:14px;background:#333;color:#888;margin-top:8px;border-radius:10px">ABBEY ROAD OFF - TAP FOR WARM</button><div id="status" style="color:#00FF66;text-align:center;font-size:12px;margin:8px">Ready - Loop ON Forever</div><button id="goLive" style="width:100%;padding:14px;background:#00FF66;color:#000;font-weight:900;border-radius:10px">📡 GO LIVE - ID: sirdio-studio-b-master</button><hr>BASS<input id="bass" type="range" min="-10" max="10" value="4" style="width:100%">TREBLE<input id="treble" type="range" min="-10" max="10" value="3" style="width:100%">DRIVE<input id="drive" type="range" min="0" max="100" value="40" style="width:100%"><br><button id="b10">-10s</button><button id="pp">PLAY/PAUSE</button><button id="f10">+10s</button> <label><input id="loop" type="checkbox" checked> LOOP FOREVER</label></div><script>let p=document.getElementById('player'),ctx,analyser,bass,treb,comp,lim,ws,gain,micS,localS,peer,micOn=false,loudOn=false;p.loop=true;document.getElementById('loop').onchange=e=>p.loop=e.target.checked;p.onended=()=>{if(document.getElementById('loop').checked){p.currentTime=0;p.play()}};document.getElementById('pp').onclick=()=>p.paused?p.play():p.pause();document.getElementById('b10').onclick=()=>p.currentTime-=10;document.getElementById('f10').onclick=()=>p.currentTime+=10;function init(){if(ctx)return;ctx=new (AudioContext||webkitAudioContext)();analyser=ctx.createAnalyser();bass=ctx.createBiquadFilter();bass.type='lowshelf';bass.frequency.value=120;treb=ctx.createBiquadFilter();treb.type='highshelf';treb.frequency.value=4000;comp=ctx.createDynamicsCompressor();lim=ctx.createDynamicsCompressor();lim.threshold.value=-8;ws=ctx.createWaveShaper();let k=3.5,n=44100,c=new Float32Array(n);for(let i=0;i<n;i++){let x=i*2/n-1;c[i]=(3+k)*x*20*(Math.PI/180)/(Math.PI+k*Math.abs(x))}ws.curve=c;gain=ctx.createGain();gain.gain.value=1;try{let s=ctx.createMediaElementSource(p);s.connect(bass);bass.connect(treb);treb.connect(ws);ws.connect(comp);comp.connect(lim);lim.connect(gain);gain.connect(analyser);analyser.connect(ctx.destination)}catch(e){}}document.getElementById('bass').oninput=e=>{init();bass.gain.value=e.target.value};document.getElementById('treble').oninput=e=>{init();treb.gain.value=e.target.value};document.getElementById('drive').oninput=e=>{init();gain.gain.value=1+e.target.value/30};document.getElementById('loudBtn').onclick=()=>{init();loudOn=!loudOn;document.getElementById('loudBtn').textContent=loudOn?'🔥 ABBEY ROAD ON - WARM & LOUD!':'ABBEY ROAD OFF';document.getElementById('loudBtn').style.background=loudOn?'#ff6600':'#333';document.getElementById('loudBtn').style.color=loudOn?'#fff':'#888';if(ctx.state=='suspended')ctx.resume();if(loudOn){bass.gain.value=5;treb.gain.value=2;gain.gain.value=2.2}else{bass.gain.value=0;treb.gain.value=0;gain.gain.value=1}};document.getElementById('micBtn').onclick=async()=>{init();if(!micOn){try{localS=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false}});micS=ctx.createMediaStreamSource(localS);micS.connect(bass);micOn=true;document.getElementById('micBtn').textContent='MIC LIVE';p.volume=0.2}catch(e){alert(e)}}else{localS.getTracks().forEach(t=>t.stop());micOn=false;document.getElementById('micBtn').textContent='MIC OFF';p.volume=1}};document.getElementById('goLive').onclick=()=>{if(peer)return;peer=new Peer('sirdio-studio-b-master');peer.on('open',id=>{document.getElementById('status').textContent='🔴 LIVE! '+id+' Listeners can connect!'});peer.on('call',call=>{let dest=ctx.createMediaStreamDestination();try{gain.connect(dest)}catch(e){}call.answer(localS||dest.stream)})};setInterval(()=>{if(!analyser)return;let d=new Uint8Array(analyser.frequencyBinCount);analyser.getByteFrequencyData(d);let a=d.reduce((x,y)=>x+y,0)/d.length;document.getElementById('vu').style.width=Math.min(100,a*1.5)+'%'},100)</script></body></html>
