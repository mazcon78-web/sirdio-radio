<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GUEST MIC</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>body{margin:0;background:#0a0a0a;color:#fff;font-family:system-ui;display:flex;align-items:center;justify-content:center;height:100vh;text-align:center}.box{background:#151515;padding:20px;border-radius:16px;width:90%;max-width:360px;border:1px solid #222}.btn{width:100%;padding:20px;border-radius:12px;border:0;font-weight:900;font-size:18px}.red{background:#ff0000;color:#fff;animation:blink .8s infinite}.green{background:#00ff88;color:#000}@keyframes blink{50%{opacity:.4}}</style></head><body>
<div class="box"><h2>🎤 GUEST MIC</h2><p id="st">Tap to request studio</p><button id="req" class="btn red">🔴 TAP TO JOIN LIVE</button><audio id="mon" autoplay muted></audio></div>
<script>let peer,localStream;document.getElementById('req').onclick=async()=>{document.getElementById('st').textContent='Getting mic...';localStream=await navigator.mediaDevices.getUserMedia({audio:true});peer=new Peer();peer.on('open',id=>{let conn=peer.connect('sirdio-studio-b-master');conn.on('open',()=>{conn.send({type:'guest-request',peerId:id});document.getElementById('st').textContent='Request sent - waiting...';document.getElementById('req').textContent='🟡 WAITING APPROVAL';document.getElementById('req').className='btn green';});});peer.on('call',call=>{call.answer(localStream);call.on('stream',s=>{document.getElementById('mon').srcObject=s;document.getElementById('st').textContent='🟢 YOU ARE LIVE!';document.getElementById('req').textContent='🟢 LIVE NOW';document.getElementById('req').className='btn green';});});};</script></body></html>
