<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SIRDIO STUDIO - CLEAN WARM</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
body{background:#000;color:#fff;font-family:Arial;text-align:center;padding:15px}
.card{max-width:380px;margin:auto;background:#111;border:2px solid #ff6600;border-radius:20px;padding:20px}
audio{width:100%;margin:10px 0}
.btn{width:100%;padding:18px;margin:8px 0;border-radius:12px;font-weight:900;font-size:16px;border:none}
#play{background:#fff;color:#000}
#mic{background:#222;color:#888;border:2px solid #333}
#mic.on{background:#111;color:#00FF66;border-color:#00FF66;box-shadow:0 0 10px #00FF66}
#abbey{background:#222;color:#888;border:2px solid #333}
#abbey.on{background:#ff6600;color:#000;box-shadow:0 0 15px #ff6600}
#live{background:#222;color:#888;border:2px solid #333}
#live.on{background:#00FF66;color:#000;box-shadow:0 0 15px #00FF66}
#vu{height:8px;background:#222;border-radius:4px;overflow:hidden;margin:10px 0}
#vuF{height:100%;width:20%;background:#00FF66;transition:width 0.1s}
</style></head><body>
<h2 style="color:#ff6600">SIRDIO STUDIO B</h2>
<p style="color:#666;font-size:12px">CLEAN • WARM • LOUD</p>
<div class="card">
<audio id="p" controls loop src="ALHA-01.mp3"></audio>
<div id="vu"><div id="vuF"></div></div>
<div id="info" style="font-size:11px;color:#888">Ready • Abbey Road Clean Mode</div>
<button class="btn" id="play">▶️ PLAY</button>
<button class="btn" id="mic">🎙️ MIC OFF</button>
<button class="btn" id="abbey">🔌 ABBEY ROAD - TAP FOR WARM</button>
<button class="btn" id="live">📡 GO LIVE</button>
<div id="s" style="margin-top:10px;color:#00FF66;font-size:11px"></div>
</div>
<script>
let p=document.getElementById('p'),micBtn=document.getElementById('mic'),abbeyBtn=document.getElementById('abbey'),liveBtn=document.getElementById('live'),s=document.getElementById('s'),vuF=document.getElementById('vuF'),info=document.getElementById('info');
let ctx,bass,treb,comp,gain,anal,micOn=false,abbeyOn=false,liveOn=false,peer,stream,micSource;
p.loop=true;
function init(){
 if(ctx) return;
 ctx=new (window.AudioContext||window.webkitAudioContext)();
 bass=ctx.createBiquadFilter(); bass.type='lowshelf'; bass.frequency.value=150; bass.gain.value=0;
 treb=ctx.createBiquadFilter(); treb.type='highshelf'; treb.frequency.value=4000; treb.gain.value=0;
 comp=ctx.createDynamicsCompressor(); comp.threshold.value=-18; comp.knee.value=20; comp.ratio.value=3; comp.attack.value=0.01; comp.release.value=0.25;
 gain=ctx.createGain(); gain.gain.value=1;
 anal=ctx.createAnalyser(); anal.fftSize=256;
 try{
  let src=ctx.createMediaElementSource(p);
  src.connect(bass); bass.connect(treb); treb.connect(comp); comp.connect(gain); gain.connect(anal); anal.connect(ctx.destination);
 }catch(e){console.log(e)}
}
document.getElementById('play').onclick=(e)=>{
 init(); if(p.paused){p.play(); e.target.textContent='⏸️ PAUSE'}else{p.pause(); e.target.textContent='▶️ PLAY'}
 if(ctx&&ctx.state=='suspended')ctx.resume();
};
abbeyBtn.onclick=()=>{
 init();
 abbeyOn=!abbeyOn;
 if(abbeyOn){
  // CLEAN WARM - NO DISTORTION! Just bass boost + soft compression
  bass.gain.value=4;  // warm bass, not too much
  treb.gain.value=1.5; // slight brightness
  comp.threshold.value=-20; comp.ratio.value=3.5;
  gain.gain.value=1.4; // LOUD but CLEAN - was 2.5 before!
  abbeyBtn.textContent='🔥  - ';
  abbeyBtn.classList.add('on');
  info.textContent='🟠 WARM MODE - Clean Tape + Bass - ;
  info.style.color='#ff6600';
 }else{
  bass.gain.value=0; treb.gain.value=0; gain.gain.value=1; comp.ratio.value=3;
  abbeyBtn.textContent='🔌  - TAP FOR WARM';
  abbeyBtn.classList.remove('on');
  info.textContent='Bypassed';
  info.style.color='#888';
 }
 if(ctx&&ctx.state=='suspended')ctx.resume();
};
micBtn.onclick=async()=>{
 init();
 if(!micOn){
  try{
   stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});
   micSource=ctx.createMediaStreamSource(stream);
   micSource.connect(bass);
   micOn=true; micBtn.textContent='🟢 MIC LIVE'; micBtn.classList.add('on'); p.volume=0.2;
  }catch(e){alert('Mic error: '+e.message)}
 }else{
  if(micSource) micSource.disconnect();
  if(stream) stream.getTracks().forEach(t=>t.stop());
  micOn=false; micBtn.textContent='🎙️ MIC OFF'; micBtn.classList.remove('on'); p.volume=1;
 }
};
liveBtn.onclick=()=>{
 if(liveOn) return;
 init();
 if(ctx.state=='suspended')ctx.resume();
 peer=new Peer('sirdio-studio-b-master');
 peer.on('open',id=>{s.textContent='🔴 LIVE ID:'+id; liveOn=true; liveBtn.textContent='🔴 LIVE - ON AIR'; liveBtn.classList.add('on');});
 peer.on('call',c=>{
  let dest=ctx.createMediaStreamDestination();
  try{gain.connect(dest);}catch(e){}
  c.answer(stream||dest.stream);
 });
 peer.on('error',e=>{s.textContent='Live error:'+e.type});
};
setInterval(()=>{
 if(!anal) return;
 let d=new Uint8Array(anal.frequencyBinCount); anal.getByteFrequencyData(d);
 let avg=d.reduce((a,b)=>a+b,0)/d.length;
 vuF.style.width=Math.min(100,avg*0.9)+'%';
 vuF.style.background=avg>70?'#ff6600':avg>50?'#fa0':'#00FF66';
},80);
</script></body></html>
